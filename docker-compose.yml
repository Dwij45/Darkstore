# Local PostgreSQL for darkstore. Host port 5433 avoids clashing with a Postgres
# you may already run on 5432.
#   docker compose up -d
#   DATABASE_URL=postgres://darkstore:darkstore@localhost:5433/darkstore go run ./cmd/server
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: darkstore
      POSTGRES_PASSWORD: darkstore
      POSTGRES_DB: darkstore
    ports:
      - "5433:5432"
    volumes:
      - darkstore-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U darkstore -d darkstore"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  darkstore-pgdata:
